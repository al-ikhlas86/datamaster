name: Build Data Master

# Pola SAMA PERSIS proyek saudara Presensi (D:\Presensi\.github\workflows\build.yml,
# sudah terbukti jalan di lapangan) - compile TIDAK jalan tiap commit/push biasa,
# baru jalan otomatis kalau push GIT TAG berawalan "v" (mis. v1.0.0), yang berarti
# "versi ini siap dirilis ke PC sekolah". workflow_dispatch tetap ada utk build
# uji manual tanpa bikin Release/tag.
#
# Alur rilis: build (publish Launcher WPF self-contained win-x64 + publish
# DataMaster.Web LANGSUNG ke subfolder "web/" di dalam hasil publish Launcher -
# lihat ServerProcessManager.LocateServerExecutable() yang mengasumsikan tata
# letak persis ini, zip satu paket) -> release (bikin GitHub Release, tag jadi
# nomor versi) -> Launcher yang sudah terpasang otomatis cek rilis terbaru lewat
# GitHub REST API (repo ini privat, lihat UpdateChecker.cs) & pasang sendiri,
# TANPA installer & TANPA sentuhan manual di PC sekolah manapun.
#
# BEDA dari Presensi: DataMaster cuma 1 target (net10.0-windows, win-x64) - tidak
# ada dukungan net48 (tidak ada kebutuhan Windows 7 lama utk instalasi sekolah
# baru), dan hasil publish 2 PROYEK digabung jadi 1 folder sebelum di-zip (Presensi
# cuma 1 proyek/1 exe).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tentukan nomor versi dari tag git
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace 'refs/tags/v', ''
          } else {
            # workflow_dispatch manual (bukan rilis resmi) - versi placeholder,
            # TIDAK dipublish sbg Release (lihat kondisi if masing2 step di bawah).
            $v = "0.0.0-dev"
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DataMaster.slnx

      - name: Publish Launcher (self-contained win-x64)
        run: dotnet publish src/DataMaster.Launcher/DataMaster.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=false -p:Version=${{ steps.version.outputs.version }} -o publish/DataMaster

      # LANGSUNG ke subfolder "web/" di dalam hasil publish Launcher - inilah
      # struktur folder yang dicari ServerProcessManager.LocateServerExecutable()
      # di PC pengguna (baseDir/web/DataMaster.Web.exe). JANGAN ubah lokasi ini
      # tanpa ikut mengubah ServerProcessManager.cs.
      - name: Publish DataMaster.Web (self-contained win-x64) ke subfolder web/
        run: dotnet publish src/DataMaster.Web/DataMaster.Web.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=false -p:Version=${{ steps.version.outputs.version }} -o publish/DataMaster/web

      # Folder mentah ini SENGAJA cuma diupload utk build manual (workflow_dispatch,
      # dipakai developer debug) - persis alasan yang sama di build.yml Presensi:
      # rilis bertag cuma tampilkan zip yang relevan, bukan folder mentah + zip
      # sekaligus (bikin bingung "unduh yang mana").
      - name: Upload artifact (folder mentah, dipakai debug manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: DataMaster-win-x64
          path: publish/DataMaster
          retention-days: 3

      # Nama zip HARUS SAMA PERSIS dgn AssetName di UpdateChecker.cs
      # ("DataMaster-win-x64.zip") - itu yang dicari lewat GitHub API saat
      # aplikasi cek pembaruan.
      - name: Bikin zip hasil publish (diunduh app via GitHub API - UpdateChecker.cs)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "publish\DataMaster\*" -DestinationPath "dist\DataMaster-win-x64.zip" -Force

      # retention-days DIPERPENDEK dari 90 hari jadi 1 (2026-09-11, kuota
      # storage Actions BENAR2 penuh & memblokir rilis v1.4.0 gagal terbit -
      # bukan cuma "sebaiknya", ini akar masalahnya) - artifact ini cuma
      # jembatan SEMENTARA memindahkan zip dari job build ke job release DALAM
      # 1 RUN YANG SAMA (selesai dalam hitungan detik), begitu Release-nya
      # terbit (lihat job "release" di bawah) isinya 100% berlebihan - salinan
      # PERMANEN yang benar ada di GitHub Releases, yang TIDAK ikut kena kuota
      # storage Actions ini sama sekali. 90 hari x tiap rilis (~150MB) numpuk
      # sampai menghabiskan seluruh 500MB jatah cuma dari repo ini sendirian.
      - name: Upload zip (utk dipublish job release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: DataMaster-Zip
          path: dist/*.zip
          retention-days: 1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: DataMaster-Zip
          path: dist

      # Tidak ada manifest XML terpisah - UpdateChecker.cs di app baca tag_name +
      # daftar asset rilis ini LANGSUNG lewat GitHub REST API (perlu token, krn
      # repo privat), jadi cukup pastikan nama file zip di sini konsisten.
      - name: Terbitkan GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Data Master ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/*.zip

  # Artefak build MEMAKAN KUOTA STORAGE GitHub Actions (jatah 500 MB paket Free,
  # gabungan LINTAS SEMUA repo privat di akun) - Presensi pernah terukur nyata
  # 38 artefak/~4,1 GB numpuk cuma dari 1 repo, jauh di atas jatah (2026-09-02).
  # Simpan 3 RUN terbaru saja, sisanya dihapus - ini TIDAK menyentuh GitHub
  # Release dengan sendirinya (dibuktikan langsung di Presensi).
  #
  # SELAIN itu (langkah kedua di bawah, permintaan eksplisit 2026-09-09): daftar
  # Release itu SENDIRI juga dibatasi 3 terbaru - rilis lama otomatis dihapus
  # (Release + tag git-nya) begitu rilis baru ke-4 terbit, supaya halaman
  # Releases tidak menumpuk. AMAN krn Launcher/UpdateChecker.cs SELALU menarik
  # release "latest" lewat API - tidak pernah merujuk versi lama yang sengaja
  # dihapus ini.
  cleanup:
    needs: [build, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      # contents: write WAJIB utk hapus Release/tag lama di step kedua di bawah -
      # job lain (build) sengaja TIDAK diberi ini (prinsip izin seminim mungkin).
      contents: write
    steps:
      # KOREKSI 2026-09-11 (revisi ke-2, bug NYATA ditemukan lewat pengamatan
      # user - Actions tab masih tampil 3 run, bukan 2, walau label sudah
      # dibetulkan sebelumnya): analisa "tail -n +3 sudah otomatis keep-2"
      # SEBELUMNYA SALAH krn tidak memperhitungkan bahwa run YANG SEDANG
      # menjalankan langkah pembersihan ini SENDIRI belum berstatus
      # "completed" di mata GitHub API saat query di bawah dijalankan (statusnya
      # baru pindah ke completed SETELAH seluruh step run ini selesai, termasuk
      # step ini sendiri) - jadi daftar "completed" yang dilihat query ini SELALU
      # tidak menghitung dirinya sendiri. Efeknya: run baru ini nanti ikut jadi
      # bagian "2 terbaru" begitu dia selesai, tapi baru dihitung PADA RUN
      # BERIKUTNYA. Supaya steady-state-nya benar 2 (bukan 3), yang perlu
      # disisakan dari daftar "completed" LAIN (tidak termasuk diri sendiri)
      # cuma 1 - baru + 1 (dirinya sendiri, begitu selesai) = 2. Maka
      # `tail -n +3` (skip 2, hapus sisanya) diperkecil jadi `tail -n +2`
      # (skip 1, hapus sisanya). Diverifikasi lewat pengecekan nyata
      # 2026-09-11: datamaster-desktop/presensi/mobile-app SEMUA menunjukkan
      # persis 3 run tersisa di steady-state dgn +3, cocok dgn analisa ini.
      - name: Bersihkan run build lama (simpan 2 terbaru)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | "\(.created_at) \(.id)"' \
            | sort -r | tail -n +2 | awk '{print $2}' \
            | while read -r id; do
                echo "hapus run lama id=$id"
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" || true
              done

      # Rilis (Release + tag git-nya) SENGAJA JUGA dibatasi (beda dari dugaan
      # awal "Release permanen selamanya" - permintaan eksplisit user). Aman
      # krn UpdateChecker.cs SELALU menarik "latest" release lewat API - versi
      # lama yang dihapus tidak pernah dirujuk lagi oleh PC manapun yang sudah
      # ter-update. Diperkecil dari simpan-3 ke simpan-2 (2026-09-11, permintaan
      # eksplisit user "biar storage ga penuh" - kuota Actions benar2 pernah
      # penuh & memblokir rilis v1.4.0 hari yang sama, lihat commit sebelumnya).
      - name: Bersihkan Release lama (simpan 2 terbaru)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 \
            --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' \
            | while read -r tag; do
                echo "hapus release+tag lama: $tag"
                gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes || true
              done
